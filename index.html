<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A maintained OGJS starter for Vite and TypeScript." />
    <title>OGJS investigation starter</title>
  </head>
  <body>
    <main>
      <aside class="guide">
        <p class="eyebrow">Vite + TypeScript</p>
        <h1>Investigate a payment alert</h1>
        <p class="intro">OGJS owns the visual language, layout, framing, interaction, and resize lifecycle.</p>
        <dl>
          <div><dt>36</dt><dd>entities</dd></div>
          <div><dt>45</dt><dd>relationships</dd></div>
        </dl>
        <p id="status" class="status" role="status" aria-live="polite">Select a node to inspect it.</p>
      </aside>
      <section id="graph" aria-label="Payment alert investigation graph"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
